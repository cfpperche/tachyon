<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tachyon webview preview (spec 278)</title>
<!-- the harness stand-in for VS Code's runtime theme; per-view stylesheets are linked by preview.js from
     the route table (the same set the real panel links, in order). -->
<link rel="stylesheet" href="/scripts/webview-preview/theme-dark.css">
<style>
  /* fail-loud: if the bundle never hydrates, this stays visible and a screenshot is obviously wrong */
  #root:empty::after { content: "PREVIEW EMPTY — bundle did not render"; color: #f48771; padding: 16px; display: block; }
  html, body { background: var(--vscode-sideBar-background); margin: 0; }
  /* preview.js sizes #frame from the chosen view's route.frame */
  #frame { width: 340px; height: 100vh; border-right: 1px solid var(--vscode-widget-border); overflow: hidden; }
</style>
</head>
<body>
  <div id="frame"><div id="root"></div></div>
  <!-- spec 278 — the dev-only harness glue (bundled): reads ?view=&fixture=, links the view's CSS, loads the
       REAL webview bundle, waits for its ready handshake, injects the fixture once. Fails loud on any gap. -->
  <script type="module" src="/dist/webview-preview/preview.js"></script>
</body>
</html>
