<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tachyon webview preview (spec 278)</title>
<!-- the harness stand-in for VS Code's runtime theme, for the SHELL's own chrome only; the surface links
     its own copy inside the frame (per-view stylesheets come from the route table). -->
<link rel="stylesheet" href="/scripts/webview-preview/theme-dark.css">
<style>
  html, body { background: var(--vscode-sideBar-background); margin: 0; }
  /* t-b24282 / t-4a477f — the frame is an IFRAME, not a div, and that is the whole measurement
     contract: an iframe's content box IS a viewport. `?width=` moves both halves; when the catalog
     omits it, the shell passes the outer window (clamped to route.frame) so a 360 photo is a 360
     iframe, not a crop of the wide frame. A sized div moved only the box. shell.js sets the size;
     the panel edge is a box-shadow rather than a border because a shadow contributes no layout and
     no scrollable overflow — a border would make the shell 1px wider than the frame and put a
     scrollbar on every capture taken at exactly the browser's width. -->
  #frame { display: block; width: 340px; height: 100vh; border: 0; box-shadow: 1px 0 0 var(--vscode-widget-border); }
  /* fail-loud: if shell.js never runs, this stays visible next to a blank frame */
  #shell-error { color: #f48771; padding: 16px; font: 12px monospace; }
</style>
</head>
<body>
  <iframe id="frame" title="preview surface"></iframe>
  <p id="shell-error">PREVIEW SHELL DID NOT MOUNT — dist/webview-preview/shell.js is missing or threw (run `npm run build`).</p>
  <!-- spec 278 / t-b24282 — the dev-only harness SHELL (bundled): resolves the requested view's frame size
       and points the sized iframe at surface.html, which runs the preview glue inside it. -->
  <script type="module" src="/dist/webview-preview/shell.js"></script>
</body>
</html>
