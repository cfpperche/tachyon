# Spec 381 dogfood fixture — temporary project for F5 / Extension Development Host.
# Do NOT open the monorepo root for this scenario.
#
# dogfood: forced kind=agent so Inject Prompt Template accepts it (bash would
# otherwise infer terminal). Autostart so the pane is live after F5.
agents:
  dogfood:
    cmd: bash
    kind: agent
    autostart: true
  # Optional real CLI (start from sidebar if installed). Not required for inject smoke.
  claude:
    cmd: claude
    kind: agent
    autostart: false
  codex:
    cmd: codex
    kind: agent
    autostart: false
  # Terminal — must NOT appear in the inject destination picker.
  shell:
    cmd: bash
    kind: terminal
    autostart: false

commands:
  hello:
    cmd: "echo prompt-templates-dogfood-ok"
