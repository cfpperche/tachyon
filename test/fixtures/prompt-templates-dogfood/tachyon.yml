# Spec 381 dogfood fixture — temporary project for F5 / Extension Development Host.
# Do NOT open the monorepo root for this scenario.
# SDD 478 M7 — agents are NOT written here by hand. Each `agents:` entry is a pointer to a
# canonical profile under .tachyon/agents/<name>/agent.yml, and the authority that attests it is
# custodied by the host (VS Code secret storage), which a checked-in fixture cannot ship. Create
# the agents this scenario needs with "Tachyon: Agent Studio" after opening the Dev Host.
# Create `claude` and `codex` in Agent Studio: Inject Prompt Template offers AGENTS only, so the
# destination picker needs at least one. The `shell` terminal below is the negative case — it must
# NOT appear in that picker.
#
# SDD 478 M7 — the old `dogfood` row was `cmd: bash` with `kind: agent` forced on precisely so the
# picker would accept it. That shape is gone: a process cannot be an agent, so proving the picker
# now requires a real agent, created here.
terminals:
  # Must NOT appear in the inject destination picker.
  shell:
    cmd: bash
    autostart: false

commands:
  hello:
    cmd: "echo prompt-templates-dogfood-ok"
