# Dogfood fixture (companion-track-dogfood) — intent: focus (stopped OK; project task/brief/goal)
# Spec: 414. Agents start STOPPED; focus still projects without a live process.
# SDD 478 M7 — agents are NOT written here by hand. Each `agents:` entry is a pointer to a
# canonical profile under .tachyon/agents/<name>/agent.yml, and the authority that attests it is
# custodied by the host (VS Code secret storage), which a checked-in fixture cannot ship. Create
# the agents this scenario needs with "Tachyon: Agent Studio" after opening the Dev Host.
# Create grok / solo / idle (grok), plus claude and codex, all autostart off.
settings:
  maxAgents: 8
  # List user_browser_* on the Bridge so agents can discover them; pair still required to execute.
  companion:
    tabTools: true
    # SDD 422 mobile — Tailscale mesh (PC + phone same tailnet). Not multi-NIC Wi-Fi.
    lanAccess: true
    allowedHosts:
      - the-internet.herokuapp.com
      - "*.herokuapp.com"
