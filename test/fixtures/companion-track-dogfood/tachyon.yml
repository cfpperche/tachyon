# Dogfood fixture (companion-track-dogfood) — intent: focus (stopped OK; project task/brief/goal)
# Spec: 414. Agents start STOPPED; focus still projects without a live process.
settings:
  maxAgents: 8
  # List user_browser_* on the Bridge so agents can discover them; pair still required to execute.
  companion:
    tabTools: true
    allowedHosts:
      - the-internet.herokuapp.com
      - "*.herokuapp.com"

agents:
  grok:
    cmd: grok
    autostart: false
    attention: true
  solo:
    cmd: grok
    autostart: false
    attention: true
  idle:
    cmd: grok
    autostart: false
    attention: false
  claude:
    cmd: claude
  codex:
    cmd: codex
