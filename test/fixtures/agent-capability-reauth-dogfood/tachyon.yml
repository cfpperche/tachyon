# Disposable Dev Host fixture — t-4a2a6f: Authorize / Reauthorize / Authorized.
#
# `agents: {}` alone is not a loadable roster ("must be a non-empty mapping ... or declare a
# 'terminals' block"), so the terminal below is the non-empty half. Every agent in this scenario is
# created through Agent Studio — starting from zero agents is the point.
#
# The shell terminal is also how you run ./drift.sh without leaving the EDH.
settings:
  maxAgents: 4

agents: {}
terminals:
  shell:
    cmd: sh
    autostart: false
