name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install tmux + xvfb (integration host)
        run: sudo apt-get update && sudo apt-get install -y tmux xvfb
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: npx vitest run
      - name: Integration tests (xvfb)
        run: xvfb-run -a npm run test:integration
