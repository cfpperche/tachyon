name: ci

on:
  push:
    branches: [main]
  pull_request:

# t-dcd8eb — this workflow does NOT list verification steps. `npm run verify:full` is the single source
# of truth (engine/UI boundary → typecheck → build → the whole Vitest suite, which includes the Product
# Invariants). CI merely provisions a runner and calls it, so "green locally" and "green in CI" cannot
# drift into meaning different things.
#
# They used to be two hand-maintained lists, and they disagreed: verify:full skipped typecheck AND the
# engine-boundary guard, so the pre-push gate that resolves that same command skipped them too. With
# Actions out of credit nothing here ran either, and the boundary sat red on main unnoticed.
# `test/unit/ciWorkflowSingleSource.test.ts` fails the suite if a verification step reappears here.
#
# The xvfb editor-host integration suite is still a LOCAL gate, not run here: it drives a real VSCode
# host whose one-shot-command exit-code capture is sensitive to the tmux version (the runner's tmux 3.4
# leaves pane_dead_status empty for instantly-exiting panes, which the supported tmux 3.6 populates).
# Run it locally with `xvfb-run -a npm run test:integration` on tmux >= 3.6.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install tmux (real-tmux unit coverage)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run verify:full
