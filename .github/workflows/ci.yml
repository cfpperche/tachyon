name: ci

on:
  push:
    branches: [main]
  pull_request:

# Deterministic, portable core: typecheck + build + unit (the unit suite
# includes a real-tmux subset that runs against whatever tmux the runner ships).
#
# The xvfb editor-host integration suite (test/integration*) is a LOCAL gate, not
# run here: it drives a real VSCode host whose one-shot-command exit-code capture
# is sensitive to the tmux version (the runner's tmux 3.4 leaves pane_dead_status
# empty for instantly-exiting panes, which the supported tmux 3.6 populates). Run
# it locally with `xvfb-run -a npm run test:integration` on tmux >= 3.6.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install tmux (real-tmux unit coverage)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: npx vitest run
